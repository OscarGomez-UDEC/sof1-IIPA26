<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" width="400" height="300">
  <defs>
	<linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
	  <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
	  <stop offset="100%" style="stop-color:#E0F6FF;stop-opacity:1" />
	</linearGradient>
  </defs>

  <!-- Fondo cielo -->
  <rect width="400" height="300" fill="url(#skyGrad)"/>

  <!-- Edificio/Escuela -->
  <rect x="50" y="120" width="300" height="150" fill="#8B4513"/>

  <!-- Techo -->
  <polygon points="50,120 200,40 350,120" fill="#DC143C"/>

  <!-- Puerta -->
  <rect x="180" y="200" width="40" height="70" fill="#2F4F4F"/>
  <circle cx="215" cy="235" r="3" fill="#FFD700"/>

  <!-- Ventanas -->
  <g fill="#87CEEB" stroke="#000" stroke-width="2">
	<rect x="80" y="150" width="30" height="30"/>
	<rect x="130" y="150" width="30" height="30"/>
	<rect x="270" y="150" width="30" height="30"/>
	<rect x="320" y="150" width="30" height="30"/>

	<rect x="80" y="200" width="30" height="30"/>
	<rect x="130" y="200" width="30" height="30"/>
	<rect x="270" y="200" width="30" height="30"/>
	<rect x="320" y="200" width="30" height="30"/>
  </g>

  <!-- Divisiones de ventanas -->
  <g stroke="#000" stroke-width="1">
	<line x1="95" y1="150" x2="95" y2="180"/>
	<line x1="80" y1="165" x2="110" y2="165"/>
	<line x1="145" y1="150" x2="145" y2="180"/>
	<line x1="130" y1="165" x2="160" y2="165"/>
	<line x1="285" y1="150" x2="285" y2="180"/>
	<line x1="270" y1="165" x2="300" y2="165"/>
	<line x1="335" y1="150" x2="335" y2="180"/>
	<line x1="320" y1="165" x2="350" y2="165"/>
  </g>

  <!-- Bandeja de luz/sol -->
  <circle cx="350" cy="40" r="30" fill="#FFD700"/>
  <line x1="350" y1="10" x2="350" y2="0" stroke="#FFD700" stroke-width="3"/>
  <line x1="380" y1="40" x2="390" y2="40" stroke="#FFD700" stroke-width="3"/>
  <line x1="375" y1="25" x2="382" y2="18" stroke="#FFD700" stroke-width="3"/>
</svg>
