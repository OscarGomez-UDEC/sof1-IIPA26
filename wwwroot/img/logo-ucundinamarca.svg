<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" width="200" height="200">
  <!-- Fondo degradado -->
  <defs>
	<linearGradient id="gradBg" x1="0%" y1="0%" x2="100%" y2="100%">
	  <stop offset="0%" style="stop-color:#003D2E;stop-opacity:1" />
	  <stop offset="100%" style="stop-color:#00A86B;stop-opacity:1" />
	</linearGradient>
  </defs>

  <!-- Círculo de fondo -->
  <circle cx="100" cy="100" r="100" fill="url(#gradBg)"/>

  <!-- Usuario/Persona (icono) -->
  <g fill="white">
	<!-- Cabeza -->
	<circle cx="100" cy="50" r="18"/>

	<!-- Cuerpo -->
	<rect x="85" y="72" width="30" height="35" rx="4"/>

	<!-- Brazos -->
	<rect x="60" y="80" width="25" height="12" rx="6"/>
	<rect x="115" y="80" width="25" height="12" rx="6"/>

	<!-- Piernas -->
	<rect x="88" y="110" width="8" height="30" rx="4"/>
	<rect x="104" y="110" width="8" height="30" rx="4"/>
  </g>

  <!-- Decoración: acento -->
  <circle cx="140" cy="60" r="8" fill="#FFD700" opacity="0.8"/>
  <circle cx="60" cy="140" r="12" fill="#FFD700" opacity="0.6"/>
</svg>
